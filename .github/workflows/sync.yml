name: sync

on:
  schedule:
    # 说明：GitHub 的 schedule 常被延迟数小时（实测约 +6~7 小时），因此多铺几个触发点，
    # 脚本内部再用 12:00–22:30（北京时间）窗口判断过滤；命中窗口的那次会在结束前自动接力下一轮。
    - cron: "36 21 * * *"
    - cron: "36 23 * * *"
    - cron: "36 1 * * *"
    - cron: "5 4 * * *"
    - cron: "36 5 * * *"
    - cron: "5 10 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "本轮最多处理多少期（0=不限）"
        required: false
        default: "0"
      only:
        description: "只处理指定 item key（留空=按队列）"
        required: false
        default: ""
      force:
        description: "忽略时间窗限制（true/false）"
        required: false
        default: "false"
      chain:
        description: "自链接深度（内部使用，留空=0）"
        required: false
        default: "0"

concurrency:
  group: reading-sync
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: install deps
        run: pip install -r requirements.txt

      - name: configure git identity
        run: |
          git config --global user.name "reading-bot"
          git config --global user.email "reading-bot@users.noreply.github.com"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: run pipeline
        env:
          LIMIT: ${{ inputs.limit || 0 }}
          ONLY: ${{ inputs.only || '' }}
          FORCE: ${{ inputs.force || 'false' }}
          CHAIN: ${{ inputs.chain || 0 }}
          FEED_URL: ${{ secrets.FEED_URL }}
          TRANSCRIPT_BASE: ${{ secrets.TRANSCRIPT_BASE }}
          TARGET_FOLDER_ID: ${{ secrets.TARGET_FOLDER_ID }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          TENCENT_DOCS_TOKEN: ${{ secrets.TENCENT_DOCS_TOKEN }}
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          GIT_COMMIT: "1"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: reading-bot
          GIT_AUTHOR_EMAIL: reading-bot@users.noreply.github.com
          GIT_COMMITTER_NAME: reading-bot
          GIT_COMMITTER_EMAIL: reading-bot@users.noreply.github.com
        run: |
          set -euo pipefail
          ARGS=(--limit "${LIMIT:-0}")
          if [ -n "${ONLY:-}" ]; then ARGS+=(--only "$ONLY"); fi
          if [ "${FORCE:-false}" = "true" ]; then ARGS+=(--force); fi
          ARGS+=(--chain "${CHAIN:-0}")
          python run.py "${ARGS[@]}"

      - name: commit state
        if: always()
        run: |
          git config user.name "reading-bot"
          git config user.email "reading-bot@users.noreply.github.com"
          git add state/ || true
          if ! git diff --cached --quiet; then
            git commit -m "state: sync"
          fi
          git pull --rebase --autostash origin "${GITHUB_REF_NAME:-main}" || true
          git push origin "HEAD:${GITHUB_REF_NAME:-main}" || true
